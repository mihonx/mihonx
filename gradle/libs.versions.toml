[versions]
android-desugar = "2.1.5"
android-gradle = "8.13.2"
detekt = "1.23.8"
kotlin-gradle = "2.2.21"
ktlint = "1.8.0"
maven-publish = "0.35.0"
spotless = "8.1.0"
tapmoc = "0.2.0"

[libraries]
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "android-gradle" }
detekt-gradle = { module = "io.gitlab.arturbosch.detekt:io.gitlab.arturbosch.detekt.gradle.plugin", version.ref = "detekt" }
kotlin-gradle = { module = "org.jetbrains.kotlin.android:org.jetbrains.kotlin.android.gradle.plugin", version.ref = "kotlin-gradle" }
maven-publish-gradle = { module = "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin", version.ref = "maven-publish" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
tapmoc-gradle = { module = "com.gradleup.tapmoc:tapmoc-gradle-plugin", version.ref = "tapmoc" }

# Used in [/gradle/build-config/src/main/kotlin/PluginKotlinMultiplatform.kt]
android-desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "android-desugar" }
# Used in [/gradle/build-config/build.gradle.kts, /gradle/build-config/src/main/kotlin/PluginSpotless.kt]
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-gradle" }
kotlin-samWithReceiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin-gradle" }

# Used in [/gradle/build-config/src/main/kotlin/PluginKotlinMultiplatform.kt]
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin-gradle" }
# Used in [/gradle/build-config/src/main/kotlin/PluginMavenPublish.kt]
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
